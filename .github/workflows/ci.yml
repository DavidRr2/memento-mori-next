name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Use example env (if needed)
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint --if-present
      - name: Typecheck
        run: pnpm run typecheck --if-present
      - name: Format check
        run: pnpm run format --if-present
      - name: Build
        run: pnpm run build --if-present
